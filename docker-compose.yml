name: fridgebrain

services:
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      fridgebrain:
        condition: service_healthy
    environment:
      FRIDGEBRAIN_DOMINIO: "${FRIDGEBRAIN_DOMINIO:?Imposta il dominio pubblico in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    security_opt:
      - no-new-privileges:true

  fridgebrain:
    image: fridgebrain:locale
    build:
      context: .
      target: esecuzione
    init: true
    restart: unless-stopped
    user: "${FRIDGEBRAIN_UID:-1000}:${FRIDGEBRAIN_GID:-1000}"
    expose:
      - "3000"
    environment:
      FRIDGEBRAIN_DATI: /app/data
      FRIDGEBRAIN_UTENTE: "${FRIDGEBRAIN_UTENTE:?Imposta utente in .env}"
      FRIDGEBRAIN_PASSWORD: "${FRIDGEBRAIN_PASSWORD:?Imposta una password casuale in .env}"
      FRIDGEBRAIN_OFF_USER_AGENT: "${FRIDGEBRAIN_OFF_USER_AGENT:-FridgeBrain/1.0 (https://${FRIDGEBRAIN_DOMINIO})}"
      FRIDGEBRAIN_OFF_URL: "${FRIDGEBRAIN_OFF_URL:-https://world.openfoodfacts.org}"
      FRIDGEBRAIN_GENERATORE: "${FRIDGEBRAIN_GENERATORE:-disabilitato}"
      FRIDGEBRAIN_OLLAMA_URL: "${FRIDGEBRAIN_OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}"
      FRIDGEBRAIN_MODELLO: "${FRIDGEBRAIN_MODELLO:-qwen3:8b}"
      FRIDGEBRAIN_ORIGINI: "https://${FRIDGEBRAIN_DOMINIO:?Imposta il dominio pubblico in .env}"
      TZ: Europe/Rome
    volumes:
      - ./data/personali:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
